<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fit Check</title>
  <meta name="description" content="Personal fit checker: does this piece of clothing fit my body and style?">
  <meta name="theme-color" content="#1c2433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fit Check">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar"><h1>Fit Check</h1></header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="check" class="active"><span>✓</span>Check</button>
    <button data-view="saved"><span>★</span>Saved</button>
    <button data-view="profile"><span>◉</span>Profile</button>
    <button data-view="settings"><span>⚙</span>Settings</button>
  </nav>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
